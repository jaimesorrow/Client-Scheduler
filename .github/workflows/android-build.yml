name: Build Android AAB

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Show Flutter version
        run: flutter --version

      - name: Generate platform folders
        run: flutter create . --no-overwrite

      - name: Restore keystore from secret (optional)
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          mkdir -p android/app
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          {
            printf 'storePassword=%s\n' "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}"
            printf 'keyPassword=%s\n' "${{ secrets.ANDROID_KEY_PASSWORD }}"
            printf 'keyAlias=%s\n' "${{ secrets.ANDROID_KEY_ALIAS }}"
            printf 'storeFile=app/upload-keystore.jks\n'
          } > android/key.properties

      - name: Get dependencies
        run: flutter pub get

      - name: Build app bundle
        run: flutter build appbundle --release

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: appbundle
          path: build/app/outputs/bundle/release/*.aab
